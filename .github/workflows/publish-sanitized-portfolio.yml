name: Publish sanitized portfolio source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-sanitized-portfolio.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish sanitized portfolio
        shell: bash
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/portfolio-clean.tar.xz"
          extract_dir="$RUNNER_TEMP/portfolio-extracted"

          cat .portfolio-upload/chunk*.txt | tr -d '\r\n' | base64 -d > "$archive"
          xz -t "$archive"

          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          tar -xJf "$archive" -C "$extract_dir"

          project_root="$(find "$extract_dir" -type f -name index.html | head -n 1 | xargs dirname)"
          test -f "$project_root/index.html"
          test -f "$project_root/css/style.css"

          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.portfolio-upload' \
            "$project_root"/ ./

          rm -rf .portfolio-upload
          rm -f saif-portfolio-latest-source.zip
          rm -f .github/workflows/publish-sanitized-portfolio.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish latest sanitized portfolio source'
          git push
